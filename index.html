<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Главная</title>
  <link rel="stylesheet" href="./dist/css/app.css">
  <link rel="preload"
      href="/assets/fonts/nunito-sans/NunitoSans-Variable.woff2"
      as="font" type="font/woff2" crossorigin>
    <link rel="preload"
      href="/assets/fonts/garamond/CormorantGaramond-VariableFont.woff2"
      as="font" type="font/woff2" crossorigin>
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- BX: include=_header -->
 <header class="sticky-top">
  <nav class="navbar navbar-expand-lg navbar-light bg-white text-black py-2">
    <div class="container-fluid container-xxl px-xl-5">
      <div class="row align-items-center w-100 g-0">
        <div class="col-12 col-lg-6 d-flex align-items-center justify-content-between gap-3">
            <div class="d-flex gap-4">
                <a class="navbar-brand d-flex align-items-center" href="/">
                    <img
                    src="assets/images/logo-topmenu.svg"
                    alt="HANDS Ковры, созданные вручную"
                    class="img-fluid logo-img"
                    />
                </a>

                <a class="text-black fw-semibold d-flex align-items-center gap-2 text-hover-terra" href="/catalog">
                    <svg class="d-block" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 7H0M18 3H0M18 11H0M14 15H0" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                    <span>Каталог</span>
                </a>
            </div>
          
          <!-- бургер только на мобиле -->
          <button class="navbar-toggler custom-burger d-lg-none" 
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#collapsibleNavId"
                    aria-controls="collapsibleNavId"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="burger-lines"></span>
            </button>
        </div>

        <!-- Меню -->
        <div class="col-12 col-lg-6">
          <div class="collapse navbar-collapse justify-content-lg-between mt-2 mt-lg-0" id="collapsibleNavId">
            <ul class="navbar-nav me-lg-3">
              <li class="nav-item">
                <a class="nav-link active" href="/" aria-current="page">Примерка</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/">Дизайнерам</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/">Контакты</a>
              </li>
            </ul>
            <a class="text-black fw-semibold text-nowrap" href="/">
              Моя подборка <span class="text-terra">(3)</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>
</header>
  <!-- /BX -->

  <main class="flex-fill container-fluid container-xxl px-xl-5 ">
    <div class="row align-items-center mb-3">
        <div class="col-12 col-md-6">
            <h1 class="">Ковры, созданные вручную</h1>
        </div>
        <div class="col-12 col-md-4">
            <p>Каждый узор хранит историю, сотканную руками мастеров. Выберите ковер, который станет сердцем вашего дома.</p>
        </div>
    </div>
    <div class="row align-items-end mb-3">
        <div class="col-12 col-md-6">
            <div class="d-flex gap-3">
                <a class="btn btn-primary d-inline-flex gap-2 align-items-center" href="/">
                    <svg class="d-block" width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 7H0M18 3H0M18 11H0M14 15H0" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                    </svg>
                    <span>В каталог</span>
                </a>
                <a class="btn btn-secondary" href="/">
                    <span>Помощь в подборе</span>
                </a>
            </div>
        </div>
        <div class="col-12 col-md-4">
           <ul class="catalog-menu list-unstyled d-flex flex-wrap gap-3 mb-0">
            <li class="catalog-menu__item">
                <!-- TODO Bitrix: подставить ссылку на раздел "Современные" -->
                <a class="catalog-menu__link text-black text-hover-terra" href="/catalog/sovremennye/">
                    Современные
                </a>
            </li>
            <li class="catalog-menu__item">
                <!-- TODO Bitrix: подставить ссылку на раздел "Классические" -->
                <a class="catalog-menu__link text-black text-hover-terra" href="/catalog/klassicheskie/">
                    Классические
                </a>
            </li>
            <li class="catalog-menu__item">
                <!-- TODO Bitrix: подставить ссылку на раздел "Этнические" -->
                <a class="catalog-menu__link text-black text-hover-terra" href="/catalog/etnicheskie/">
                    Этнические
                </a>
            </li>
        </ul>
        </div>
    </div>
    <!-- Видео -->
    <section class="hero-video my-4">
        <video
        class="hero-video__media rounded-3"
        autoplay
        muted
        loop
        playsinline
        poster="assets/video/video_poster.png"
        >
        <!-- TODO Bitrix: заменить путь на файл из /upload/ или на FILE_SRC свойства инфоблока -->
        <source src="/assets/video/video.mp4" type="video/mp4">
        Ваш браузер не поддерживает воспроизведение видео.
        </video>
    </section>
    <!-- Видео конец -->
  </main>
  <!-- BX: include=_footer -->
  <footer class="mt-auto bg-light py-3">
    <div class="container-fluid text-center small text-muted px-xl-5">
      &copy; 2025 HANDS
    </div>
  </footer>
  <!-- /BX -->

  <!-- Если нужен функционал Bootstrap JS (модалки, dropdown): подключите bundle с Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
