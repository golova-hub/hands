<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Главная</title>
  <link rel="stylesheet" href="./dist/css/app.css">
  <link rel="preload"
      href="/assets/fonts/nunito-sans/NunitoSans-Variable.woff2"
      as="font" type="font/woff2" crossorigin>
    <link rel="preload"
      href="/assets/fonts/garamond/CormorantGaramond-VariableFont.woff2"
      as="font" type="font/woff2" crossorigin>
</head>
<body class="d-flex flex-column min-vh-100">
  <!-- BX: include=_header -->
  <header class="sticky-top">
    <nav
        class="navbar navbar-expand-lg navbar-light bg-white py-3"
    >
        <div class="container-fluid container-xxl px-xl-5">
            <a class="navbar-brand" href="/">
                <!-- SVG: logo -->
                <img
                src="assets/images/logo-topmenu.svg"
                alt="HANDS Ковры, созданные вручную"
                class="img-fluid"
                width="215"
                height="auto"
                />
            </a>
            <button
                class="navbar-toggler d-lg-none"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#collapsibleNavId"
                aria-controls="collapsibleNavId"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavId">
                <ul class="navbar-nav me-auto mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" aria-current="page"
                            >Home
                            <span class="visually-hidden">(current)</span></a
                        >
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Link</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a
                            class="nav-link dropdown-toggle"
                            href="#"
                            id="dropdownId"
                            data-bs-toggle="dropdown"
                            aria-haspopup="true"
                            aria-expanded="false"
                            >Dropdown</a
                        >
                        <div
                            class="dropdown-menu"
                            aria-labelledby="dropdownId"
                        >
                            <a class="dropdown-item" href="#"
                                >Action 1</a
                            >
                            <a class="dropdown-item" href="#"
                                >Action 2</a
                            >
                        </div>
                    </li>
                </ul>
                <form class="d-flex my-2 my-lg-0">
                    <input
                        class="form-control me-sm-2"
                        type="text"
                        placeholder="Search"
                    />
                    <button
                        class="btn btn-outline-success my-2 my-sm-0"
                        type="submit"
                    >
                        Search
                    </button>
                </form>
            </div>
        </div>
    </nav>
  </header>
  <!-- /BX -->

  <main class="flex-fill container-fluid container-xxl px-xl-5 ">
    <div class="">
        <h1 class="text-primary">Ковры, созданные вручную</h1>
      
    </div>
  </main>
  <!-- BX: include=_footer -->
  <footer class="mt-auto bg-light py-3">
    <div class="container-fluid text-center small text-muted px-xl-5">
      &copy; 2025 HANDS
    </div>
  </footer>
  <!-- /BX -->

  <!-- Если нужен функционал Bootstrap JS (модалки, dropdown): подключите bundle с Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
